# Sets up the GitHub action to automatically poll for data every 5 minutes
name: Disney Poller
on:
  # schedule:
  #   - cron: '*/6 * * * *'  # Runs every 5 minutes
  repository_dispatch:
    types: [poll-disney]
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write
  issues: write   # for pipeline-health alerts

# Never run two polls at once; a queued poll waits for the running one.
concurrency:
  group: poll
  cancel-in-progress: false

# Silences the Node.js deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Parquet is written by the daily archive workflow, so pyarrow isn't needed here
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz

      - name: Run wait_time_scraper
        run: python wait_time_scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "DisneyBot"
          git config --global user.email "bot@github.com"
          
          git add wait_times.csv data/live.json
          # Stage quarantined CSVs (or their removal once archived), if any
          if [ -d quarantine ] || git ls-files --error-unmatch quarantine >/dev/null 2>&1; then
            git add -A quarantine/
          fi
          git commit -m "Update wait times [skip ci]" || exit 0

          # The daily archive job may have pushed in the meantime; it touches different
          # files, so rebasing onto it is always clean.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Report problems
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report_problems.sh "${{ job.status }}"
