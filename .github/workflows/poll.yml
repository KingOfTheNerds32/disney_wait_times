# Sets up the GitHub action to automatically poll for data every 5 minutes
name: Disney Poller
on:
  # schedule:
  #   - cron: '*/6 * * * *'  # Runs every 5 minutes
  repository_dispatch:
    types: [poll-disney]
  workflow_dispatch:        # Allows manual trigger

permissions: 
  contents: write

# Silences the Node.js deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # This installs the base packages plus pyarrow for Parquet compression
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz pyarrow

      - name: Run wait_time_scraper
        run: python wait_time_scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "DisneyBot"
          git config --global user.email "bot@github.com"
          
          # Stage both the newly downsized live file AND the new history directory
          git add wait_times.csv history/ || true
          
          # Commit and push without triggering a recursive action run
          git commit -m "Update wait times and compress historical logs [skip ci]" || true
          git push || true
