# Once a day, folds the rolling wait_times.csv into the monthly Parquet archive and
# rebuilds data/history.json (heatmaps, best times, typical curves) for the dashboard.
name: Daily Archive
on:
  schedule:
    - cron: '17 11 * * *'  # 11:17 UTC = 3:17/4:17 AM Pacific, while the parks are closed
  workflow_dispatch:       # Allows manual trigger

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz pyarrow

      - name: Archive and rebuild history
        run: python archive.py

      - name: Commit and push changes
        run: |
          git config --global user.name "DisneyBot"
          git config --global user.email "bot@github.com"

          git add history/ data/history.json
          git commit -m "Archive wait times and rebuild history [skip ci]" || exit 0

          # Polls push every 5 minutes but never touch these files, so rebasing is clean.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
