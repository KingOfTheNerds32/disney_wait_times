<!DOCTYPE html>
<html>
<head>
    <title>Park Telemetry Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; height: 100vh; display: flex; flex-direction: column; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: white; cursor: pointer; }
        /* This ensures the chart stays big and readable */
        .chart-container { flex-grow: 1; position: relative; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 500px; }
        h2 { margin: 0 0 10px 0; font-size: 22px; }
    </style>
</head>
<body>

    <h2>📊 7-Day Wait Time Averages</h2>
    
    <div class="controls">
        <div>
            <label>Park:</label> 
            <select id="parkFilter" onchange="updateLandOptions()"></select>
        </div>
        
        <div id="landWrapper">
            <label>Land:</label> 
            <select id="landFilter" onchange="renderChart()"></select>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="waitChart"></canvas>
    </div>

    <script>
        let globalData = [];
        let chartInstance = null;

        Papa.parse("wait_times.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                globalData = results.data;
                console.log("Unique Parks in CSV:", [...new Set(globalData.map(i => i.park_name))]);
                processInitialData();
            }
        });

        function processInitialData() {
            // Filter out junk/numbers and get unique names
            const parks = [...new Set(globalData.map(i => i.park_name))]
                            .filter(p => p && isNaN(p) && p.length > 2);
            
            const parkSelect = document.getElementById('parkFilter');
            parkSelect.innerHTML = '';
            parks.forEach(park => {
                let opt = document.createElement('option');
                opt.value = opt.innerText = park;
                parkSelect.appendChild(opt);
            });
            updateLandOptions();
        }

        function updateLandOptions() {
            const selectedPark = document.getElementById('parkFilter').value;
            const landWrapper = document.getElementById('landWrapper');
            const landSelect = document.getElementById('landFilter');
            
            // Fuzzy search for Universal to handle any naming variations
            if (selectedPark.toLowerCase().includes("universal")) {
                landWrapper.style.display = "none";
                landSelect.innerHTML = '<option value="ALL">All Lands</option>';
            } else {
                landWrapper.style.display = "inline-block";
                const lands = [...new Set(globalData.filter(i => i.park_name === selectedPark).map(i => i.land))].filter(Boolean);
                landSelect.innerHTML = '';
                lands.forEach(land => {
                    let opt = document.createElement('option');
                    opt.value = opt.innerText = land;
                    landSelect.appendChild(opt);
                });
            }
            renderChart();
        }

        function renderChart() {
            const park = document.getElementById('parkFilter').value;
            const land = document.getElementById('landFilter').value;

            const now = new Date();
            const sevenDaysAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));

            const filtered = globalData.filter(i => {
                const itemDate = new Date(i.fetch_timestamp);
                const isCorrectPark = i.park_name === park;
                const isCorrectLand = (land === "ALL" || i.land === land);
                const isWithinWeek = itemDate >= sevenDaysAgo;
                
                // Keep the Halloween filter surgical
                const landStr = (i.land || "").toLowerCase();
                const isHalloween = landStr.includes("halloween");
                
                return isCorrectPark && isCorrectLand && isWithinWeek && !isHalloween;
            });

            const timeBuckets = {}; 
            const ridesSet = new Set();

            filtered.forEach(row => {
                const ride = row.ride_name;
                // STAGE 1: Skip if ride is a number or missing (Fix for image_116833.png)
                if (!ride || !isNaN(ride) || ride.length < 3) return;

                const timeParts = (row.fetch_timestamp || "").split(' ');
                if (timeParts.length < 2) return;
                
                const timeStr = timeParts[1].substring(0, 5); 
                const wait = parseInt(row.wait_time);

                ridesSet.add(ride);
                if (!timeBuckets[timeStr]) timeBuckets[timeStr] = {};
                if (!timeBuckets[timeStr][ride]) timeBuckets[timeStr][ride] = [];
                timeBuckets[timeStr][ride].push(wait);
            });

            const sortedTimes = Object.keys(timeBuckets).sort();
            const datasets = Array.from(ridesSet).map((ride, index) => {
                const hue = (index * 137.5) % 360; 
                return {
                    label: ride,
                    data: sortedTimes.map(t => {
                        const vals = timeBuckets[t][ride];
                        if (!vals || vals.length === 0) return null;
                        return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                    }),
                    borderColor: `hsl(${hue}, 70%, 45%)`,
                    backgroundColor: `hsla(${hue}, 70%, 45%, 0.1)`,
                    borderWidth: 2.5,
                    pointRadius: 0, 
                    tension: 0.4
                };
            });

            if (chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('waitChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: sortedTimes, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // CRITICAL: This plus CSS fixes the "squish"
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { 
                            position: 'bottom', 
                            labels: { boxWidth: 12, padding: 15, font: { size: 11 } } 
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Avg Minutes' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
