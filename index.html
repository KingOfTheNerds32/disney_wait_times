<!DOCTYPE html>
<html>
<head>
    <title>Park Telemetry Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: white; cursor: pointer; min-width: 200px; }
        .chart-container { flex-grow: 1; position: relative; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 600px; }
        h2 { margin: 0 0 10px 0; font-size: 22px; color: #2c3e50; }
        label { font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <h2>📊 Theme Park 7-Day Wait Averages</h2>
    
    <div class="controls">
        <div>
            <label>Park:</label> 
            <select id="parkFilter" onchange="updateLandOptions()"></select>
        </div>
        
        <div id="landWrapper">
            <label>Land:</label> 
            <select id="landFilter" onchange="renderChart()"></select>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="waitChart"></canvas>
    </div>

    <script>
        let globalData = [];
        let chartInstance = null;

        // 1. Load the CSV
        Papa.parse("wait_times.csv", {
            download: true,
            header: true, // Set to true so the first row is ignored as data
            skipEmptyLines: true,
            complete: function(results) {
                // Map the data to ensure we are using the correct keys regardless of CSV header naming
                globalData = results.data.map(row => {
                    // This handles cases where headers might have spaces or different casing
                    const keys = Object.keys(row);
                    return {
                        fetch_timestamp: row[keys[0]],
                        park_name: row[keys[1]],
                        land: row[keys[2]],
                        ride_name: row[keys[3]],
                        wait_time: row[keys[4]],
                        is_open: row[keys[5]]
                    };
                });
                initDashboard();
            }
        });

        function initDashboard() {
            // Get unique parks and filter out any header artifacts or junk
            const parks = [...new Set(globalData.map(i => i.park_name))]
                            .filter(p => p && p !== "park_name" && isNaN(p) && p.length > 2);
            
            const parkSelect = document.getElementById('parkFilter');
            parkSelect.innerHTML = '';
            parks.forEach(park => {
                let opt = document.createElement('option');
                opt.value = opt.innerText = park;
                parkSelect.appendChild(opt);
            });
            updateLandOptions();
        }

        function updateLandOptions() {
            const selectedPark = document.getElementById('parkFilter').value;
            const landWrapper = document.getElementById('landWrapper');
            const landSelect = document.getElementById('landFilter');
            
            // Universal Studios Hollywood (ID 66) logic
            if (selectedPark === "Universal Studios Hollywood") {
                landWrapper.style.display = "none";
                landSelect.innerHTML = '<option value="ALL">All Rides</option>';
            } else {
                landWrapper.style.display = "inline-block";
                const lands = [...new Set(globalData.filter(i => i.park_name === selectedPark).map(i => i.land))]
                                .filter(l => l && l !== "land" && l.trim() !== "" && !l.toLowerCase().includes("halloween"));
                
                landSelect.innerHTML = '';
                lands.forEach(land => {
                    let opt = document.createElement('option');
                    opt.value = opt.innerText = land;
                    landSelect.appendChild(opt);
                });
            }
            renderChart();
        }

        function renderChart() {
            const park = document.getElementById('parkFilter').value;
            const land = document.getElementById('landFilter').value;

            const now = new Date();
            const sevenDaysAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));

            const filtered = globalData.filter(i => {
                const ts = i.fetch_timestamp;
                if (!ts || ts === "fetch_timestamp") return false;
                
                const itemDate = new Date(ts);
                const isCorrectPark = i.park_name === park;
                const isWithinWeek = itemDate >= sevenDaysAgo;
                
                const isUniversal = park === "Universal Studios Hollywood";
                const isCorrectLand = isUniversal || (land === "ALL" || i.land === land);

                // Filter out Halloween
                const landStr = (i.land || "").toLowerCase();
                const rideStr = (i.ride_name || "").toLowerCase();
                const isHalloween = landStr === "halloween" || rideStr.includes("halloween");

                return isCorrectPark && isWithinWeek && isCorrectLand && !isHalloween;
            });

            const timeBuckets = {}; 
            const ridesSet = new Set();

            filtered.forEach(row => {
                const ride = row.ride_name;
                const ts = row.fetch_timestamp;
                
                // Final check to avoid numbers in legend
                if (!ride || ride === "ride_name" || !isNaN(ride) || ride.length < 3) return;

                const timeMatch = ts.match(/(\d{2}:\d{2})/);
                if (!timeMatch) return;
                const timeStr = timeMatch[0];
                
                const wait = parseInt(row.wait_time);
                if (isNaN(wait)) return;

                ridesSet.add(ride);
                if (!timeBuckets[timeStr]) timeBuckets[timeStr] = {};
                if (!timeBuckets[timeStr][ride]) timeBuckets[timeStr][ride] = [];
                timeBuckets[timeStr][ride].push(wait);
            });

            const sortedTimes = Object.keys(timeBuckets).sort();
            const datasets = Array.from(ridesSet).map((ride, index) => {
                const hue = (index * 137.5) % 360; 
                return {
                    label: ride,
                    data: sortedTimes.map(t => {
                        const vals = timeBuckets[t][ride];
                        if (!vals) return null;
                        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
                        return Math.round(avg);
                    }),
                    borderColor: `hsl(${hue}, 70%, 45%)`,
                    backgroundColor: `hsla(${hue}, 70%, 45%, 0.1)`,
                    borderWidth: 2,
                    pointRadius: 0, 
                    tension: 0.3
                };
            });

            if (chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('waitChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: sortedTimes, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { 
                            position: 'bottom', 
                            labels: { boxWidth: 10, padding: 8, font: { size: 10 } } 
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Avg Minutes' } },
                        x: { ticks: { maxTicksLimit: 24 } }
                    }
                }
            });
        }
    </script>
</body>
</html>
