<!DOCTYPE html>
<html>
<head>
    <title>7-Day Average Wait Times</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; min-width: 150px; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; }
        #landWrapper { display: inline-block; }
    </style>
</head>
<body>

    <h2>📊 7-Day Average Wait Times</h2>
    <p>Displays the average wait time for each 5-minute increment over the last week.</p>
    
    <div class="controls">
        <label>Park:</label> 
        <select id="parkFilter" onchange="updateLandOptions()"></select>
        
        <div id="landWrapper">
            <label>Land:</label> 
            <select id="landFilter" onchange="renderChart()"></select>
        </div>
    </div>

    <div class="container">
        <canvas id="waitChart"></canvas>
    </div>

    <script>
        let globalData = [];
        let chartInstance = null;

        // 1. Fetch and Parse the CSV
        Papa.parse("wait_times.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                globalData = results.data;
                processInitialData();
            }
        });

        function processInitialData() {
            const parks = [...new Set(globalData.map(i => i.park_name))].filter(Boolean);
            const parkSelect = document.getElementById('parkFilter');
            parks.forEach(park => {
                let opt = document.createElement('option');
                opt.value = opt.innerText = park;
                parkSelect.appendChild(opt);
            });
            updateLandOptions();
        }

        function updateLandOptions() {
            const selectedPark = document.getElementById('parkFilter').value;
            const landWrapper = document.getElementById('landWrapper');
            const landSelect = document.getElementById('landFilter');
            
            // Universal Studios Hollywood logic: Hide Land filter
            if (selectedPark === "Universal Studios Hollywood") {
                landWrapper.style.display = "none";
                landSelect.innerHTML = '<option value="ALL">All Lands</option>';
            } else {
                landWrapper.style.display = "inline-block";
                const lands = [...new Set(globalData.filter(i => i.park_name === selectedPark).map(i => i.land))].filter(Boolean);
                landSelect.innerHTML = '';
                lands.forEach(land => {
                    let opt = document.createElement('option');
                    opt.value = opt.innerText = land;
                    landSelect.appendChild(opt);
                });
            }
            renderChart();
        }

        function renderChart() {
            const park = document.getElementById('parkFilter').value;
            const land = document.getElementById('landFilter').value;

            const now = new Date();
            const sevenDaysAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));

            // 2. Filter logic
            const filtered = globalData.filter(i => {
                const itemDate = new Date(i.fetch_timestamp);
                const isCorrectPark = i.park_name === park;
                const isCorrectLand = (land === "ALL" || i.land === land);
                const isWithinWeek = itemDate >= sevenDaysAgo;
                
                // Filter out Halloween Horror Nights or specific Halloween lands
                const isHalloween = i.land && i.land.toLowerCase().includes("halloween");
                
                return isCorrectPark && isCorrectLand && isWithinWeek && !isHalloween;
            });

            // 3. Clean Ride Names (Fixing the legend issue in image_116833.png)
            const timeBuckets = {}; 
            const ridesSet = new Set();

            filtered.forEach(row => {
                const ride = row.ride_name;
                
                // SANITIZATION: Skip rows where ride_name is just a number or missing
                if (!ride || !isNaN(ride)) return;

                const timeStr = row.fetch_timestamp.split(' ')[1].substring(0, 5); 
                const wait = parseInt(row.wait_time);

                ridesSet.add(ride);
                if (!timeBuckets[timeStr]) timeBuckets[timeStr] = {};
                if (!timeBuckets[timeStr][ride]) timeBuckets[timeStr][ride] = [];
                timeBuckets[timeStr][ride].push(wait);
            });

            const sortedTimes = Object.keys(timeBuckets).sort();
            const datasets = Array.from(ridesSet).map((ride, index) => {
                return {
                    label: ride,
                    data: sortedTimes.map(t => {
                        const vals = timeBuckets[t][ride];
                        if (!vals) return null;
                        return vals.reduce((a, b) => a + b, 0) / vals.length;
                    }),
                    borderColor: `hsl(${index * 137.5}, 70%, 50%)`,
                    backgroundColor: `hsla(${index * 137.5}, 70%, 50%, 0.1)`,
                    borderWidth: 2,
                    pointRadius: 0, 
                    tension: 0.3
                };
            });

            if (chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('waitChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: sortedTimes, datasets: datasets },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15 } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Avg Wait (Min)' } },
                        x: { title: { display: true, text: 'Time of Day' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
